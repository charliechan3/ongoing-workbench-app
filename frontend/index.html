<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover：允许铺满全面屏/刘海的可用区域，安全区由 CSS 的 env(safe-area-inset-*) 处理
       interactive-widget=resizes-content：软键盘弹出时压缩布局视口（而非浮在内容之上），
       这样底部抽屉里的输入框不会被键盘挡住（Chrome/Android 支持；iOS 由浏览器自身滚动处理） -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <!-- 移动端浏览器地址栏配色：与页面顶栏（--surface）一致，减少割裂感 -->
  <meta name="theme-color" content="#ffffff" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="进行时" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <!-- PWA：让手机可以「添加到主屏幕」后以独立应用形态打开（无地址栏、独立任务切换）。
       display=standalone 由 manifest 声明；图标分两套——iOS 用 apple-touch-icon（会被系统自己裁圆角，
       所以要满幅不透明的 PNG），Android 用 manifest 里的 maskable 图标。 -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <title>个人工作台</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
