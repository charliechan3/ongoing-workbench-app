:root {
  --bg: #f7f7fb;
  --surface: #ffffff;
  --surface-2: #f3f2f9;
  --border: #eae9f2;
  --border-strong: #dcd9e8;

  --primary: #7c5cff;
  --primary-hover: #6a48f5;
  --primary-soft: #f0ecff;
  --primary-border: #d9d0ff;

  --text: #26243a;
  --text-2: #6f6b85;
  --text-3: #a4a0b8;

  --red: #e5484d;      /* 涨/重要/截止 */
  --green: #30a46c;    /* 跌/完成 */
  --orange: #f76b15;
  --blue: #3e63dd;
  --cyan: #12a594;
  --yellow: #f5a623;

  --radius: 14px;
  --radius-sm: 9px;
  --shadow-sm: 0 1px 2px rgba(38, 36, 58, 0.05);
  --shadow-md: 0 4px 16px rgba(38, 36, 58, 0.07);
  --shadow-lg: 0 12px 40px rgba(38, 36, 58, 0.14);

  --font: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  --mono: "SF Mono", "JetBrains Mono", Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body, #app { height: 100%; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* 滚动条 */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #d8d5e6; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #c3bfd8; }
::-webkit-scrollbar-track { background: transparent; }

a { color: var(--primary); text-decoration: none; }
button { font-family: inherit; }

/* 布局骨架 */
.layout { display: flex; height: 100%; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.main-inner { flex: 1; overflow-y: auto; padding: 28px 34px 60px; }

/* 通用卡片 */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 20px 22px;
}

/* 按钮 */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 7px 14px;
  font-size: 13px;
  cursor: pointer;
  transition: all .15s ease;
  white-space: nowrap;
  user-select: none;
}
.btn:hover { border-color: var(--primary-border); background: var(--primary-soft); color: var(--primary); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-hover); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.danger { color: var(--red); }
.btn.danger:hover { background: #fdecec; border-color: #f5c2c4; color: var(--red); }
.btn.sm { padding: 4px 10px; font-size: 12px; border-radius: 7px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 8px;
  border: none; background: transparent; color: var(--text-3);
  cursor: pointer; transition: all .15s ease; font-size: 14px;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }

/* 输入框 */
.input, .select, .textarea {
  width: 100%;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  padding: 8px 12px;
  font-size: 13px;
  font-family: inherit;
  color: var(--text);
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-soft);
}
.textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
label.field { display: block; margin-bottom: 14px; }
label.field > span { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 5px; font-weight: 500; }

/* 标签 */
.tag {
  display: inline-flex; align-items: center; gap: 4px;

}
.tag.primary { background: var(--primary-soft); color: var(--primary); }
.tag.green { background: #e7f6ee; color: #2a8f5e; }

.tag.orange { background: #fef0e4; color: #dd5f0c; }
.tag.blue { background: #eaefff; color: #3a58c8; }
.tag.cyan { background: #e3f6f3; color: #0c8f80; }
.tag.yellow { background: #fdf5e3; color: #c8860a; }
.tag.gray { background: #efeff4; color: #6f6b85; }

/* 状态点 */
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }

/* 页头 */
.page-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 22px; gap: 16px; }
.page-title { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
.page-sub { color: var(--text-2); font-size: 13px; margin-top: 3px; }

.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th {

  padding: 8px 12px; border-bottom: 1px solid var(--border);

.table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.table tr:last-child td { border-bottom: none; }
.table tbody tr:hover { background: #faf9fe; }

/* 空状态 */
.empty { text-align: center; color: var(--text-3); padding: 48px 0; }
.empty .big { font-size: 30px; margin-bottom: 10px; opacity: .6; }

/* 弹窗 */
.modal-mask {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(30, 28, 48, 0.4);
  backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.modal {
  background: var(--surface);
  border-radius: 18px;
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 560px;
  max-height: 86vh;
  display: flex; flex-direction: column;
  animation: pop .18s ease;
}
.modal.wide { max-width: 760px; }
@keyframes pop { from { transform: scale(.96) translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-head { padding: 18px 22px 0; display: flex; align-items: center; justify-content: space-between; }
.modal-head h3 { font-size: 16px; }
.modal-body { padding: 16px 22px; overflow-y: auto; }
.modal-foot { padding: 14px 22px 18px; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--border); margin-top: 4px; }

/* 进度条 */
.progress { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.progress > div { height: 100%; background: var(--primary); border-radius: 999px; transition: width .3s ease; }
.progress.green > div { background: var(--green); }
.progress.orange > div { background: var(--orange); }

/* toast */
.toast-wrap { position: fixed; top: 18px; right: 18px; z-index: 300; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: #2a2838; color: #fff; font-size: 13px;
  padding: 10px 16px; border-radius: 10px;
  box-shadow: var(--shadow-lg);
  animation: slideIn .2s ease;
  display: flex; align-items: center; gap: 8px;
}
.toast.ok::before { content: "✓"; color: #7ee2b8; font-weight: 700; }
.toast.err::before { content: "✕"; color: #ff9a9c; font-weight: 700; }
@keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }

/* 日期选择高亮 */
.cal-day.today { border: 1.5px solid var(--primary); }
.cal-day.sel { background: var(--primary); color: #fff; font-weight: 600; }

/* Markdown 渲染 */
.md { font-size: 13.5px; line-height: 1.75; }
.md h1, .md h2, .md h3 { margin: 14px 0 8px; line-height: 1.4; }
.md h1 { font-size: 20px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15px; }
.md p { margin: 7px 0; }
.md ul, .md ol { padding-left: 22px; margin: 7px 0; }
.md li { margin: 3px 0; }
.md code { background: var(--surface-2); border-radius: 5px; padding: 1px 6px; font-family: var(--mono); font-size: 12.5px; }
.md pre { background: #232130; color: #e8e6f2; border-radius: 10px; padding: 14px 16px; overflow-x: auto; margin: 10px 0; }
.md pre code { background: none; padding: 0; color: inherit; }
.md blockquote { border-left: 3px solid var(--primary-border); padding-left: 12px; color: var(--text-2); margin: 8px 0; }
.md img { max-width: 100%; border-radius: 8px; }
.md hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
.md table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
.md th, .md td { border: 1px solid var(--border); padding: 6px 10px; }
.md th { background: var(--surface-2); }

/* 工具类 */
.flex { display: flex; align-items: center; gap: 8px; }
.flex-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.grow { flex: 1; min-width: 0; }

.mono { font-family: var(--mono); }
.mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; } .mt-20 { margin-top: 20px; }

.gap-4 { gap: 4px; } .gap-8 { gap: 8px; } .gap-12 { gap: 12px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.grid-4 { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.checkbox {
  width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid var(--border-strong);
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  transition: all .15s; flex-shrink: 0; background: var(--surface); font-size: 11px; color: #fff;
}
.checkbox.on { background: var(--primary); border-color: var(--primary); }
.checkbox:hover { border-color: var(--primary); }
